<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#da7b2e">
    <title>Crested Gecko Care</title>
    <style>
        :root {
            --bg: #f6f1e8;
            --surface: #fff8ef;
            --text: #1f1b16;
            --muted: #615649;
            --accent: #da7b2e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(231, 184, 121, 0.35), transparent 30%),
                linear-gradient(180deg, #f3ead9 0%, #f9f4ec 100%);
        }

        .card {
            width: min(100%, 480px);
            padding: 28px;
            border-radius: 28px;
            background: var(--surface);
            box-shadow: 0 20px 60px rgba(104, 67, 30, 0.12);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 2rem;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            color: white;
            background: var(--accent);
            padding: 12px 16px;
            border-radius: 999px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Offline</h1>
        <p>The app is temporarily offline. Reconnect to load chat and live care updates.</p>
        <a href="/main">Try again</a>
    </main>
</body>
</html>
