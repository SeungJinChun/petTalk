<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#da7b2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Crested Gecko Care">
    <title>{{ title }}</title>
    <link rel="manifest" href="{{ manifest_url | default('/manifest.webmanifest') }}">
    <link rel="icon" href="{{ url_for('static', path='icons/icon-192.png') }}" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='icons/icon-192.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <script src="{{ url_for('static', path='supabase_auth.js') }}"></script>
</head>
<body
    class="{{ body_class | default('', true) }}"
    data-sw-url="{{ sw_url | default('/sw.js') }}"
>
    <div class="page-shell">
        <header class="site-header">
            <nav class="topbar">
                <a class="brand" href="{{ main_url if main_url is defined else '/main' }}">
                    <span class="brand-mark">Home</span>
                </a>
                <button
                    id="pwa-install-button"
                    class="topbar-install-btn"
                    type="button"
                    hidden
                >
                    앱 설치
                </button>
            </nav>
            {% block hero %}{% endblock %}
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        (() => {
            const swUrl = document.body.dataset.swUrl || "/sw.js";
            const installButton = document.getElementById("pwa-install-button");
            let deferredInstallPrompt = null;

            const isStandalone = () => {
                const mediaStandalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
                const iosStandalone = typeof navigator.standalone === "boolean" && navigator.standalone;
                return mediaStandalone || iosStandalone;
            };

            const hideInstallButton = () => {
                if (installButton) {
                    installButton.hidden = true;
                }
            };

            const showInstallButton = () => {
                if (installButton && !isStandalone()) {
                    installButton.hidden = false;
                }
            };

            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register(swUrl).catch(() => {});
                });
            }

            if (isStandalone()) {
                hideInstallButton();
            }

            window.addEventListener("beforeinstallprompt", (event) => {
                event.preventDefault();
                deferredInstallPrompt = event;
                showInstallButton();
            });

            window.addEventListener("appinstalled", () => {
                deferredInstallPrompt = null;
                hideInstallButton();
            });

            if (installButton) {
                installButton.addEventListener("click", async () => {
                    if (!deferredInstallPrompt) {
                        return;
                    }

                    deferredInstallPrompt.prompt();
                    try {
                        await deferredInstallPrompt.userChoice;
                    } finally {
                        deferredInstallPrompt = null;
                        hideInstallButton();
                    }
                });
            }
        })();
    </script>
</body>
</html>
