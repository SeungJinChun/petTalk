<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#da7b2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Crested Gecko Care">
  <title>{{ title }}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <style>
    :root {
      --bg: #f7f4ed;
      --card: #ffffff;
      --ink: #2f2a24;
      --muted: #7d7469;
      --accent: #7f9d7a;
      --accent-dark: #557052;
      --line: #e6dfd4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(59, 47, 36, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.55; }
    label { display: block; margin: 14px 0 8px; font-weight: 700; font-size: 14px; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      background: var(--accent);
      color: white;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
    button.secondary {
      margin-top: 10px;
      background: #eee8df;
      color: var(--ink);
    }
    .msg { margin-top: 14px; font-size: 14px; color: var(--muted); min-height: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>로그인</h1>
    <p>크레스티드 게코 케어 기록을 계정에 저장하려면 로그인해주세요.</p>

    <label for="email">이메일</label>
    <input id="email" type="email" />

    <label for="password">비밀번호</label>
    <input id="password" type="password" />

    <button id="signin">로그인</button>
    <button id="signup" class="secondary">회원가입</button>
    <div id="msg" class="msg"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/supabase_auth.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }

    const SUPABASE_URL = "{{ supabase_url }}";
    const SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";
    const NEXT_URL = "{{ next_url }}";

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const msg = document.getElementById("msg");

    async function saveSession(session) {
      if (session?.access_token) {
        window.auth.setToken(session.access_token);
      }
    }

    (async () => {
      const { data } = await client.auth.getSession();
      if (data?.session?.access_token) {
        await saveSession(data.session);
        location.href = NEXT_URL || "/main";
      }
    })();

    document.getElementById("signin").onclick = async () => {
      msg.textContent = "로그인 중...";
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } = await client.auth.signInWithPassword({ email, password });

      if (error) return msg.textContent = error.message;

      await saveSession(data.session);
      location.href = NEXT_URL || "/main";
    };

    document.getElementById("signup").onclick = async () => {
      msg.textContent = "회원가입 중...";
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const emailRedirectTo = `${location.origin}/login?next_url=${encodeURIComponent(NEXT_URL || "/main")}`;

      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo,
        },
      });

      if (error) return msg.textContent = error.message;

      msg.textContent = "메일 확인해주세요";
    };
  </script>
</body>
</html>
