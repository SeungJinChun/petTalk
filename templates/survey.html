<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <style>
    :root {
      --bg: #f7f4ed;
      --card: #ffffff;
      --ink: #2f2a24;
      --muted: #7d7469;
      --accent: #7f9d7a;
      --line: #e6dfd4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(59, 47, 36, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.55; }
    label { display: block; margin: 14px 0 8px; font-weight: 700; font-size: 14px; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      background: var(--accent);
      color: white;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
    .msg { margin-top: 14px; font-size: 14px; color: var(--muted); min-height: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>처음이라 한 가지만 물어볼게</h1>
    <p>도마뱀 이름만 먼저 알려줘. 나머지는 대화하면서 천천히 채우면 돼.</p>

    <label for="pet-name">도마뱀 이름</label>
    <input id="pet-name" type="text" maxlength="40" value="{{ draft_pet_name }}" placeholder="예: 모리" />

    <button id="save-name">시작하기</button>
    <div id="msg" class="msg"></div>
  </main>

  <script src="/static/supabase_auth.js?v=20260428a"></script>
  <script>
    (() => {
      const nextUrl = "{{ next_url }}";
      const input = document.getElementById("pet-name");
      const button = document.getElementById("save-name");
      const msg = document.getElementById("msg");

      button.addEventListener("click", async () => {
        const petName = input.value.trim();
        if (!petName) {
          msg.textContent = "이름을 먼저 적어줘.";
          input.focus();
          return;
        }

        button.disabled = true;
        msg.textContent = "저장 중...";

        try {
          const response = await fetch("/api/onboarding/name", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pet_name: petName }),
          });
          const payload = await response.json();
          if (!response.ok || !payload.ok) {
            throw new Error(payload.reason || "save_failed");
          }
          location.href = payload.redirect_url || nextUrl || "/main";
        } catch (_error) {
          msg.textContent = "저장에 실패했어. 잠시 후 다시 시도해줘.";
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
