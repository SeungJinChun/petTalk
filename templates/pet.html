{% extends "base.html" %}

{% block hero %}
<section class="sub-hero">
    <p class="eyebrow">profile</p>
    <h1>{{ pet_name }}</h1>
    <p class="hero-text">Basic information only.</p>
</section>
{% endblock %}

{% block content %}
<section class="section-block">
    <div class="info-grid">
        {% for item in pet_facts %}
        <article class="info-card">
            <p class="card-mini-title">{{ item.label }}</p>
            <h3>{{ item.value }}</h3>
        </article>
        {% endfor %}
    </div>
</section>
{% endblock %}
